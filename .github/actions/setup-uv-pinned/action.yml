name: 'Setup pinned uv'
description: >
  Install the reviewed uv version (OD-1 pin; single source .github/uv-version,
  consistency-tested by tests/test_uv_pin_consistency.py). Two-stage download;
  never fetches an unreviewed "latest" uv.
inputs:
  uv-version:
    description: 'Reviewed uv version to install'
    required: false
    default: '0.12.24'
runs:
  using: 'composite'
  steps:
    - name: Install pinned uv
      shell: bash
      run: |
        set -euo pipefail
        tmp="$(mktemp /tmp/uv-install.XXXXXX.sh)"
        curl -LsSf "https://astral.sh/uv/${{ inputs.uv-version }}/install.sh" -o "$tmp"
        sh "$tmp"
        rm -f "$tmp"
        # Prepend the install dir to THIS step's PATH (a bare `uv --version`
        # below must resolve the fresh pin even when $HOME/.local/bin was not
        # already on PATH) and register it unconditionally for later steps,
        # ahead of any pre-existing uv. The astral.sh installer's default
        # install dir is $HOME/.local/bin.
        UV_INSTALL_BIN="$HOME/.local/bin"
        export PATH="$UV_INSTALL_BIN:$PATH"
        echo "$UV_INSTALL_BIN" >> "$GITHUB_PATH"
        uv --version
