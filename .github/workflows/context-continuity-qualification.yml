name: Context continuity qualification

on:
  push:
    branches: [feat/context-continuity-v4-20260923]
  pull_request:
    paths:
      - '.github/workflows/context-continuity-qualification.yml'
      - 'ares_runtime/continuity/**'
      - 'tests/ares_runtime/test_continuity*'
      - 'hermes_state_continuity.py'
      - 'docs/context-continuity/**'

permissions:
  contents: read

concurrency:
  group: context-continuity-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  source-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Record exact tracked source (no credentials or working state)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/continuity-source"
          git rev-parse HEAD > "$RUNNER_TEMP/continuity-source/HEAD.txt"
          git ls-tree -r HEAD > "$RUNNER_TEMP/continuity-source/TREE.txt"
          git archive --format=tar.gz HEAD > "$RUNNER_TEMP/continuity-source/source.tar.gz"
          (cd "$RUNNER_TEMP/continuity-source" && sha256sum HEAD.txt TREE.txt source.tar.gz > SHA256SUMS)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: continuity-source-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/continuity-source/
          retention-days: 7
          if-no-files-found: error

  # Real product-test jobs are added with their implementation. Exporting an
  # exact source archive is preflight evidence, never a product PASS.
