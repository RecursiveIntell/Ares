name: Context continuity qualification

on:
  push:
    branches: [feat/context-continuity-v4-20260923]
  pull_request:
    paths:
      - '.github/workflows/context-continuity-qualification.yml'
      - 'ares_runtime/continuity/**'
      - 'tests/ares_runtime/test_continuity*'
      - 'hermes_state_continuity.py'
      - 'scripts/run_checkpoint_context.py'
      - 'docs/context-continuity/**'

permissions:
  contents: read

concurrency:
  group: context-continuity-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  focused-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        with:
          version: '0.9.28'
      - name: Install locked test dependencies
        run: uv sync --frozen --extra dev --python 3.13
      - name: Run actual continuity modules through the canonical test runner
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse HEAD
          .venv/bin/python --version
          HERMES_PYTHON="$PWD/.venv/bin/python" HERMES_TEST_WORKERS=2 HERMES_TEST_FILE_RETRIES=0 \
            scripts/run_tests.sh tests/ares_runtime/test_continuity*.py \
            tests/ares_runtime/test_managed_calls.py tests/test_turn_run_custody.py -- -q
          .venv/bin/ruff check ares_runtime/continuity tests/ares_runtime/test_continuity*.py scripts/run_checkpoint_context.py
