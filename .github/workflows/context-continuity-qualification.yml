permissions:
  contents: read

concurrency:
  group: context-continuity-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  native-external-owner:
    name: Native external owner paired source
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # These are the native repository's existing hosted-CI settings at the
    # pinned base (.github/workflows/ci.yml). Local guarded execution is not
    # changed. This job certifies the exact candidate tree, not a published
    # native release or installed daemon capability.
    env:
      CARGO_BUILD_JOBS: "2"
      CARGO_TERM_COLOR: always
      CARGO_NET_OFFLINE: "false"
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUNNER: /usr/bin/env
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: ares
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: RecursiveIntell/recursive-agent
          ref: 11fefae304d43d9d72f7a238f9d2df77862b51c6
          path: recursive-agent
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: RecursiveIntell/Libraries
          ref: 0b099ec416de60f6adafb182f1d1e83795d05c56
          path: Libraries
          persist-credentials: false
      - name: Bind the exact native candidate tree
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, pathlib, subprocess
          evidence = pathlib.Path("ares/docs/context-continuity")
          manifest = json.loads((evidence / "native-external-owner.json").read_text())
          patch = evidence / "native-external-owner.patch"
          def git(path, *args):
              return subprocess.check_output(["git", "-C", path, *args], text=True).strip()
          assert git("recursive-agent", "rev-parse", "HEAD") == manifest["base_commit"]
          assert git("Libraries", "rev-parse", "HEAD") == manifest["libraries_commit"]
          assert hashlib.sha256(patch.read_bytes()).hexdigest() == manifest["patch_sha256"]
          subprocess.run(["git", "-C", "recursive-agent", "apply", "--check", str(patch.resolve())], check=True)
          subprocess.run(["git", "-C", "recursive-agent", "apply", "--index", str(patch.resolve())], check=True)
          assert git("recursive-agent", "write-tree") == manifest["candidate_tree"]
          print(json.dumps(manifest, sort_keys=True))
          PY
      - name: Install native test dependencies
        run: |
          set -euo pipefail
          rustup toolchain install 1.94.0 --profile minimal --component rustfmt --component clippy
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y bubblewrap libseccomp-dev strace
      - name: Admit Bubblewrap on the ephemeral hosted runner
        run: |
          set -euo pipefail
          if sysctl -n kernel.apparmor_restrict_unprivileged_userns >/dev/null 2>&1; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          if sysctl -n kernel.unprivileged_userns_clone >/dev/null 2>&1; then
            sudo sysctl -w kernel.unprivileged_userns_clone=1
          fi
          bwrap --ro-bind / / -- /usr/bin/true
      - name: Run native paired-root gates
        working-directory: recursive-agent
        run: |
          set -euo pipefail
          cargo +1.94.0 metadata --locked --format-version 1 --no-deps >/dev/null
          cargo +1.94.0 fmt --all -- --check
          cargo +1.94.0 check --locked --workspace
          cargo +1.94.0 clippy --locked --workspace --all-targets -- -D warnings
          cargo +1.94.0 test --locked --workspace --all-targets --no-fail-fast
          cargo +1.94.0 build --locked -p recursive-agent-daemon --bin ra-daemon
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        with:
          version: '0.9.28'
      - name: Run Ares against the exact paired daemon
        working-directory: ares
        run: |
          set -euo pipefail
          uv sync --frozen --extra dev --extra anthropic --python 3.13
          HERMES_TEST_CONTEXT_DAEMON_BIN="$GITHUB_WORKSPACE/recursive-agent/target/debug/ra-daemon" \
            HERMES_PYTHON="$PWD/.venv/bin/python" HERMES_TEST_WORKERS=1 HERMES_TEST_FILE_RETRIES=0 \
            scripts/run_tests.sh tests/ares_runtime/test_context_native_paired.py -- -q
  focused-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        with:
          version: '0.9.28'
      - name: Install locked test dependencies
        run: uv sync --frozen --extra dev --extra anthropic --python 3.13
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: RecursiveIntell/Libraries
          ref: 0b099ec416de60f6adafb182f1d1e83795d05c56
          path: native-owner-source
          persist-credentials: false
      - name: Build and test pinned native Governor
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.94.0 --profile minimal
          cargo +1.94.0 test --locked --manifest-path native-owner-source/context-governor/Cargo.toml
          sha256sum native-owner-source/context-governor/target/debug/context-governor
      - name: Run continuity and adjacent ownership surfaces
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse HEAD
          .venv/bin/python --version
          HERMES_TEST_CONTEXT_GOVERNOR_BIN="$PWD/native-owner-source/context-governor/target/debug/context-governor" \
