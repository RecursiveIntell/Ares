name: Ares CI health report

# Plan Task 0.2: measured CI health + lane policy. Dispatch-first: this
# workflow produces the baseline and ongoing reports on demand; a weekly
# schedule is added once the report has proven stable in practice.

on:
  workflow_dispatch: {}

permissions:
  actions: read
  contents: read
  issues: read

jobs:
  report:
    name: CI health report
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up pinned uv
        uses: ./.github/actions/setup-uv-pinned

      - name: Generate CI health report
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          uv run --python 3.14 python scripts/ci/ci_health_report.py \
            --workflows ci.yaml,install-e2e.yml,osv-scanner.yml,e2e-desktop.yml \
            --limit 50 \
            --out "ci-health/${GITHUB_RUN_ID}"

      - name: Upload report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ci-health-report
          path: ci-health/
          retention-days: 30
