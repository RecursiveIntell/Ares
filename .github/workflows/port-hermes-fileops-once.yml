name: Port dependent Hermes file-op efficiency chain once

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  port-fileops:
    if: github.event.pull_request.head.ref == 'upstream/hermes-efficiency-sync-20260907'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: upstream/hermes-efficiency-sync-20260907
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # 8.2.0
        with:
          version: "0.9.28"
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock

      - name: Set up Python 3.11
        uses: ./.github/actions/retry
        with:
          command: uv python install 3.11

      - name: Install canonical test dependencies
        uses: ./.github/actions/retry
        with:
          command: uv sync --locked --python 3.11 --extra all --extra dev --extra anthropic --extra mistral --extra fal --extra modal --extra daytona --extra hindsight --extra parallel-web

      - name: Configure Git
        run: |
          git config user.name "Ares Upstream Port Bot"
          git config user.email "ares-upstream-port@users.noreply.github.com"
          git remote add hermes https://github.com/NousResearch/hermes-agent.git
          git fetch --no-tags hermes main

      - name: Port file-operation chain in dependency order
        shell: bash
        run: |
          set -euo pipefail
          for sha in \
            9fbb3b716a5786c5dd2c986b610fdf9ae9bae6ad \
            d3275acf80a05ca79e6ce817d4965283ff7f6f11 \
            8cab422ab09332c1867af81ee4e910878ac1172b
          do
            echo "=== cherry-pick $sha ==="
            if ! git cherry-pick -x "$sha"; then
              echo "Dependency-ordered file-op port still conflicts at $sha" >&2
              git status --short >&2 || true
              git diff --name-only --diff-filter=U >&2 || true
              git cherry-pick --abort || true
              exit 42
            fi
          done

      - name: Validate file operations
        env:
          OPENROUTER_API_KEY: ""
          OPENAI_API_KEY: ""
          NOUS_API_KEY: ""
        run: |
          git diff --check
          uv run --python 3.11 python -m compileall -q tools/file_operations.py tests/tools/file_ops_fakes.py
          uv run --python 3.11 python -m pytest -q \
            tests/tools/test_file_ops_single_roundtrip.py \
            tests/tools/test_file_operations.py \
            tests/tools/test_file_operations_edge_cases.py \
            tests/tools/test_file_ops_native_local_read.py

      - name: Remove bootstrap and push
        run: |
          git rm .github/workflows/port-hermes-fileops-once.yml
          git commit -m 'chore(upstream): remove file-op port bootstrap'
          git push origin HEAD:upstream/hermes-efficiency-sync-20260907
