name: Port dependent Hermes file-op efficiency chain once

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: ares-pr34-fileops-port
  cancel-in-progress: false

jobs:
  port-fileops:
    if: >-
      github.event.pull_request.number == 34 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'upstream/hermes-efficiency-sync-20260907'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      UPSTREAM_SHA: 2237be355906fbe6065ce1815711eee52b2d646e
      ARES_BASE_SHA: 7ecc1f0a94b967abb89153a4904ca6551b6c7128
      BEFORE_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Pin source and reject a moved starting point
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$BEFORE_SHA"
          test "$(git rev-parse HEAD^)" = 40057231a1d9b4a8ef247fcd65664fb45f352b34
          test -z "$(git status --porcelain)"
          git merge-base --is-ancestor "$ARES_BASE_SHA" HEAD
          git config user.name 'Ares Upstream Port Bot'
          git config user.email 'ares-upstream-port@users.noreply.github.com'
          git remote add hermes https://github.com/NousResearch/hermes-agent.git
          git fetch --no-tags hermes "$UPSTREAM_SHA"
          test "$(git rev-parse FETCH_HEAD)" = "$UPSTREAM_SHA"
          git update-ref refs/heads/evidence-hermes-v0211 "$UPSTREAM_SHA"
          git update-ref refs/heads/evidence-ares-base "$ARES_BASE_SHA"
          git update-ref refs/heads/evidence-pr34-before "$BEFORE_SHA"
          mkdir -p "$RUNNER_TEMP/ares-pr34-evidence"

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # 8.2.0
        with:
          version: '0.9.28'
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock

      - name: Set up Python 3.11
        uses: ./.github/actions/retry
        with:
          command: uv python install 3.11

      - name: Install canonical test dependencies
        uses: ./.github/actions/retry
        with:
          command: uv sync --locked --python 3.11 --extra all --extra dev --extra anthropic --extra mistral --extra fal --extra modal --extra daytona --extra hindsight --extra parallel-web

      - name: Port reviewed file-operation dependency chain
        shell: bash
        run: |
          set -euo pipefail
          for sha in \
            9fbb3b716a5786c5dd2c986b610fdf9ae9bae6ad \
            d3275acf80a05ca79e6ce817d4965283ff7f6f11 \
            8cab422ab09332c1867af81ee4e910878ac1172b
          do
            git merge-base --is-ancestor "$sha" "$UPSTREAM_SHA"
            if ! git cherry-pick -x "$sha"; then
              git status --short
              git cherry-pick --abort
              exit 42
            fi
          done
          python - <<'PY'
          import subprocess
          import os
          paths = set(subprocess.check_output(
              ['git', 'diff', '--name-only', os.environ['BEFORE_SHA'], 'HEAD'],
              text=True).splitlines())
          allowed = {'tools/file_operations.py', 'tests/tools/test_file_ops_single_roundtrip.py'}
          if paths != allowed:
              raise SystemExit(f'Unexpected file-operation delta: {sorted(paths)}')
          PY
          git diff --exit-code "$BEFORE_SHA" HEAD -- ares_runtime
          git diff --check "$BEFORE_SHA" HEAD

      - name: Validate file operations
        env:
          OPENROUTER_API_KEY: ''
          OPENAI_API_KEY: ''
          NOUS_API_KEY: ''
        shell: bash
        run: |
          set -euo pipefail
          uv run --locked --python 3.11 python -m compileall -q tools/file_operations.py tests/tools/file_ops_fakes.py
          # Native-read and native/shell parity tests are classes in this
          # existing suite, not a separate test_file_ops_native_local_read.py.
          uv run --locked --python 3.11 python -m pytest -q \
            tests/tools/test_file_ops_single_roundtrip.py \
            tests/tools/test_file_operations.py \
            tests/tools/test_file_operations_edge_cases.py \
            --junitxml="$RUNNER_TEMP/ares-pr34-evidence/fileops-junit.xml" \
            2>&1 | tee "$RUNNER_TEMP/ares-pr34-evidence/fileops-pytest.txt"

      - name: Remove bootstrap from the validated candidate
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/port-hermes-fileops-once.yml
          git commit -m 'chore(upstream): remove validated file-op port bootstrap'
          git diff --check "$BEFORE_SHA" HEAD

      - name: Export exact source and test evidence for reconciliation
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/ares-pr34-evidence"
          mkdir -p "$out"
          git update-ref refs/heads/evidence-pr34-candidate HEAD
          git bundle create "$out/ares-pr34-source.bundle" \
            refs/heads/evidence-hermes-v0211 \
            refs/heads/evidence-ares-base \
            refs/heads/evidence-pr34-before \
            refs/heads/evidence-pr34-candidate
          git bundle verify "$out/ares-pr34-source.bundle"
          git show-ref refs/heads/evidence-hermes-v0211 refs/heads/evidence-ares-base \
            refs/heads/evidence-pr34-before refs/heads/evidence-pr34-candidate > "$out/source-refs.txt"
          git diff --stat "$ARES_BASE_SHA" HEAD > "$out/candidate-stat.txt"
          git ls-files '*AGENTS.md' '*upstream*' '*reconcil*' '*rematerial*' > "$out/owner-file-index.txt"
          (cd "$out" && sha256sum ares-pr34-source.bundle > SHA256SUMS)

      - name: Upload source and validation evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ares-pr34-reconciliation-source-${{ github.run_id }}
          path: ${{ runner.temp }}/ares-pr34-evidence/
          retention-days: 7
          if-no-files-found: error
          compression-level: 0

      - name: Push only if the reviewed branch has not moved
        shell: bash
        run: |
          set -euo pipefail
          branch=upstream/hermes-efficiency-sync-20260907
          remote_sha=$(git ls-remote origin "refs/heads/$branch" | cut -f1)
          test "$remote_sha" = "$BEFORE_SHA"
          # Never force: a concurrent update rejects the push rather than
          # replacing another operator's work. Main and live state are untouched.
          git push origin "HEAD:refs/heads/$branch"
