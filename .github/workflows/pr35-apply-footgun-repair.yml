name: PR35 apply Windows footgun repair

on:
  push:
    branches:
      - hermes-ares-recon
    paths:
      - .github/workflows/pr35-apply-footgun-repair.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact PR branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          ref: hermes-ares-recon
          fetch-depth: 0

      - name: Verify and apply patch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          base64 --decode .github/pr35-footgun.patch.gz.b64 > /tmp/pr35-footgun.patch.gz
          echo "76982b0a8923fa7e50d14676615f4bf8b5147b151ea9fba66f319b94ff9de45f  /tmp/pr35-footgun.patch.gz" | sha256sum -c -
          gzip -dc /tmp/pr35-footgun.patch.gz > /tmp/pr35-footgun.patch
          echo "5e24505c728f25f79daac28d376caf9616cdceef0856f032647bc67187e482c1  /tmp/pr35-footgun.patch" | sha256sum -c -
          git apply --check /tmp/pr35-footgun.patch
          git apply /tmp/pr35-footgun.patch
          python3 scripts/check-windows-footguns.py --all
          python3 -m py_compile plugins/context_engine/_context_governor/__init__.py
          git diff --check

      - name: Commit and fast-forward push validated repair
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin hermes-ares-recon
          test "$(git rev-parse origin/hermes-ares-recon)" = "$GITHUB_SHA"
          rm -f .github/workflows/pr35-apply-footgun-repair.yml .github/pr35-footgun.patch.gz.b64
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(context-governor): make timeout termination portable"
          git push origin HEAD:hermes-ares-recon
