name: PR35 apply validated environment reconciliation

on:
  push:
    branches:
      - hermes-ares-recon
    paths:
      - .github/workflows/pr35-apply-env-recon.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact PR branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          ref: hermes-ares-recon
          fetch-depth: 0

      - name: Reassemble and verify patch payload
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          cat \
            .github/pr35-env-recon.patch.gz.b64.part00 \
            .github/pr35-env-recon.patch.gz.b64.part01 \
            .github/pr35-env-recon.patch.gz.b64.part02 \
            .github/pr35-env-recon.patch.gz.b64.part03 \
            .github/pr35-env-recon.patch.gz.b64.part04 \
            .github/pr35-env-recon.patch.gz.b64.part05 \
            .github/pr35-env-recon.patch.gz.b64.part06 \
            .github/pr35-env-recon.patch.gz.b64.part07 \
            .github/pr35-env-recon.patch.gz.b64.part08 \
            .github/pr35-env-recon.patch.gz.b64.part09 \
            .github/pr35-env-recon.patch.gz.b64.part10 \
            > /tmp/pr35-env-recon.patch.gz.b64
          base64 --decode /tmp/pr35-env-recon.patch.gz.b64 > /tmp/pr35-env-recon.patch.gz
          echo "273dcd67c2898ffedd8b49fb681e873d8db6189c5a3db1fee2889a2c004bb6a0  /tmp/pr35-env-recon.patch.gz" | sha256sum -c -
          gzip -dc /tmp/pr35-env-recon.patch.gz > /tmp/pr35-env-recon.patch
          echo "f6448bc9aee2874be64cee2f3dfa52268cc99257f476c975c4cecdf0c1963d97  /tmp/pr35-env-recon.patch" | sha256sum -c -
          git apply --check /tmp/pr35-env-recon.patch

      - name: Apply and validate owner-preserving reconciliation
        shell: bash
        run: |
          set -euo pipefail
          git apply /tmp/pr35-env-recon.patch
          python3 scripts/check_compat_pointers.py
          python3 -m py_compile \
            agent/chat_completion_helpers.py \
            agent/transports/codex.py \
            gateway/run.py \
            gateway/slash_commands.py \
            hermes_constants.py \
            model_tools.py \
            tests/tools/test_backend_subprocess_env_boundary.py \
            tests/tools/test_local_env_blocklist.py \
            tools/env_passthrough.py \
            tools/environments/base.py \
            tools/environments/base_output.py \
            tools/environments/docker.py \
            tools/environments/local.py \
            tools/environments/local_env_policy.py \
            tools/environments/singularity.py \
            tools/mcp_tool.py
          git diff --check

      - name: Commit and fast-forward push exact validated patch
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin hermes-ares-recon
          test "$(git rev-parse origin/hermes-ares-recon)" = "$GITHUB_SHA"
          rm -f \
            .github/workflows/pr35-apply-env-recon.yml \
            .github/pr35-env-recon.patch.gz \
            .github/pr35-env-recon.patch.gz.b64.part00 \
            .github/pr35-env-recon.patch.gz.b64.part01 \
            .github/pr35-env-recon.patch.gz.b64.part02 \
            .github/pr35-env-recon.patch.gz.b64.part03 \
            .github/pr35-env-recon.patch.gz.b64.part04 \
            .github/pr35-env-recon.patch.gz.b64.part05 \
            .github/pr35-env-recon.patch.gz.b64.part06 \
            .github/pr35-env-recon.patch.gz.b64.part07 \
            .github/pr35-env-recon.patch.gz.b64.part08 \
            .github/pr35-env-recon.patch.gz.b64.part09 \
            .github/pr35-env-recon.patch.gz.b64.part10
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(runtime): reconcile environment ownership boundaries"
          git push origin HEAD:hermes-ares-recon
