name: Apply Context Governor settlement follow-up (temporary)
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/context-governor-settlement-followup-once.yml'
      - '.cg-closure/runtime-settlement-followup.patch.b64'
permissions:
  contents: write
concurrency:
  group: context-governor-settlement-followup
  cancel-in-progress: false
jobs:
  apply:
    if: github.head_ref == 'repair/context-governor-runtime-closure-20260909' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
      - uses: astral-sh/setup-uv@v7
        with:
          version: '0.9.28'
      - name: Verify preimage, apply exact follow-up, and test
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object plugins/context_engine/_context_governor/__init__.py)" = 'd7b3f125207c51c3fc368171c49435ed3241105d'
          test "$(git hash-object tests/agent/test_context_governor_restore.py)" = 'cc9874908f50755b1c081b79c8c5da16c89d3a40'
          test "$(git hash-object tests/plugins/test_context_governor_fd_ownership.py)" = '23e05040027753e4a428db8c6c6ed52546640a68'
          test "$(git hash-object tests/plugins/test_context_governor_runtime_closure.py)" = '0ca549e2b059fe52806f8424effe457aa4d27af0'
          python3 - <<'PY'
          import base64, gzip, hashlib, pathlib, subprocess
          source = pathlib.Path('.cg-closure/runtime-settlement-followup.patch.b64')
          packed = base64.b64decode(source.read_text().strip(), validate=True)
          if hashlib.sha256(packed).hexdigest() != 'd6135acd02ac7c59e5403d71d5f1878e35e656e82ae22e3503340064475b96fd':
              raise SystemExit('settlement patch archive digest mismatch')
          raw = gzip.decompress(packed)
          if hashlib.sha256(raw).hexdigest() != '676707ce6dcef83f8d9f8c8f619494f0ed305a773ddfce58ff770092a528acf1':
              raise SystemExit('settlement patch digest mismatch')
          allowed = {
              'plugins/context_engine/_context_governor/__init__.py',
              'tests/agent/test_context_governor_restore.py',
              'tests/plugins/test_context_governor_fd_ownership.py',
              'tests/plugins/test_context_governor_runtime_closure.py',
          }
          paths = {line[6:] for line in raw.decode().splitlines() if line.startswith('+++ b/')}
          if paths != allowed:
              raise SystemExit(f'unexpected patch paths: {paths!r}')
          subprocess.run(['git','apply','--check','--whitespace=fix','-'], input=raw, check=True)
          subprocess.run(['git','apply','--whitespace=fix','-'], input=raw, check=True)
          PY
          git diff --check
          uv sync --frozen --extra dev
          HERMES_PYTHON="$PWD/.venv/bin/python" scripts/run_tests.sh -j 2 \
            tests/plugins/test_context_governor_protocol.py \
            tests/plugins/test_context_governor_fd_ownership.py \
            tests/plugins/test_context_governor_runtime_closure.py \
            tests/agent/test_context_governor_restore.py -- -q
          .venv/bin/python scripts/check-windows-footguns.py --all
          uvx --from ruff==0.15.10 ruff check \
            plugins/context_engine/_context_governor \
            tests/plugins/test_context_governor_protocol.py \
            tests/plugins/test_context_governor_fd_ownership.py \
            tests/plugins/test_context_governor_runtime_closure.py \
            tests/agent/test_context_governor_restore.py
          .venv/bin/python -m compileall -q plugins/context_engine/_context_governor tests/plugins tests/agent/test_context_governor_restore.py
          git checkout -- test_durations.json || true
          git diff --check
      - name: Commit only tested settlement source and tests
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Ares Context Governor Closure'
          git config user.email 'ares-context-governor-closure@users.noreply.github.com'
          git add \
            plugins/context_engine/_context_governor/__init__.py \
            tests/agent/test_context_governor_restore.py \
            tests/plugins/test_context_governor_fd_ownership.py \
            tests/plugins/test_context_governor_runtime_closure.py
          git commit -m 'fix(context-governor): retain host-accepted pending settlement'
          git push origin HEAD:repair/context-governor-runtime-closure-20260909
