name: Apply Context Governor runtime closure once
on:
  pull_request:
    types: [synchronize, reopened]
    paths:
      - '.github/workflows/context-governor-runtime-apply-once.yml'
      - '.ares-cg-closure/runtime-stage.tar.gz.b64'
permissions:
  contents: write
concurrency:
  group: context-governor-runtime-closure-publisher
  cancel-in-progress: false
jobs:
  apply:
    if: github.head_ref == 'repair/context-governor-closure-20260909' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
        with:
          version: '0.9.28'
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock
      - name: Set up locked Python
        run: uv python install 3.11
      - name: Install canonical test dependencies
        run: uv sync --locked --python 3.11 --extra all --extra dev --extra anthropic --extra mistral --extra fal --extra modal --extra daytona --extra hindsight --extra parallel-web
      - name: Verify preimage, apply payload, and test exact candidate
        shell: bash
        run: |
          set -euo pipefail
          payload='.ares-cg-closure/runtime-stage.tar.gz.b64'
          test -f "$payload" || exit 0
          test "$(git hash-object plugins/context_engine/_context_governor/__init__.py)" = 'd29e2f271630d8b1900e8584b41f2f7e77a4380c'
          test "$(git hash-object tests/agent/test_context_governor_restore.py)" = 'cc9874908f50755b1c081b79c8c5da16c89d3a40'
          test "$(git hash-object tests/plugins/test_context_governor_fd_ownership.py)" = '36cd122bbe251f781e433da14c5cde2b5d27b067'
          base64 -d "$payload" > "$RUNNER_TEMP/runtime-stage.tar.gz"
          echo '8791981bab92eb224bcd4664952266dcd352720da803deeea9084ce75a78ec15  '"$RUNNER_TEMP/runtime-stage.tar.gz" | sha256sum -c -
          python - <<'PY'
          import tarfile
          from pathlib import Path
          archive=Path(__import__('os').environ['RUNNER_TEMP'])/'runtime-stage.tar.gz'
          allowed={
            'plugins/context_engine/_context_governor/__init__.py',
            'tests/agent/test_context_governor_restore.py',
            'tests/plugins/test_context_governor_fd_ownership.py',
            'tests/plugins/test_context_governor_runtime_closure.py',
          }
          with tarfile.open(archive, 'r:gz') as tf:
              members=tf.getmembers()
              names={m.name for m in members}
              assert names == allowed, names
              assert all(m.isfile() and not m.issym() and not m.islnk() for m in members)
              tf.extractall('.', filter='data')
          PY
          git diff --check
          .venv/bin/python -m py_compile \
            plugins/context_engine/_context_governor/__init__.py \
            plugins/context_engine/_context_governor/protocol.py \
            tests/agent/test_context_governor_restore.py \
            tests/plugins/test_context_governor_fd_ownership.py \
            tests/plugins/test_context_governor_protocol.py \
            tests/plugins/test_context_governor_runtime_closure.py
          .venv/bin/ruff check \
            plugins/context_engine/_context_governor/__init__.py \
            plugins/context_engine/_context_governor/protocol.py \
            tests/agent/test_context_governor_restore.py \
            tests/plugins/test_context_governor_fd_ownership.py \
            tests/plugins/test_context_governor_protocol.py \
            tests/plugins/test_context_governor_runtime_closure.py
          HERMES_PYTHON=.venv/bin/python scripts/run_tests.sh -j 2 \
            tests/agent/test_context_governor_restore.py \
            tests/plugins/test_context_governor_fd_ownership.py \
            tests/plugins/test_context_governor_key_state_v2.py \
            tests/plugins/test_context_governor_protocol.py \
            tests/plugins/test_context_governor_release_identity.py \
            tests/plugins/test_context_governor_runtime_closure.py \
            tests/run_agent/test_compression_boundary.py \
            tests/run_agent/test_compression_boundary_hook.py \
            tests/scripts/test_ares_context_governor_candidate.py \
            tests/scripts/test_ares_context_governor_scanners.py -- -q
          git checkout -- test_durations.json || true
          git diff --check
      - name: Commit only tested runtime and tests
        shell: bash
        run: |
          set -euo pipefail
          payload='.ares-cg-closure/runtime-stage.tar.gz.b64'
          test -f "$payload" || exit 0
          git config user.name 'Context Governor Closure'
          git config user.email 'context-governor-closure@users.noreply.github.com'
          git add \
            plugins/context_engine/_context_governor/__init__.py \
            tests/agent/test_context_governor_restore.py \
            tests/plugins/test_context_governor_fd_ownership.py \
            tests/plugins/test_context_governor_runtime_closure.py
          git commit -m 'fix(context-governor): bind host settlement and typed subprocess lifecycle'
          git push origin HEAD:repair/context-governor-closure-20260909
