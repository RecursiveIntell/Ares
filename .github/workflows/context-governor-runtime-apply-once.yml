name: Apply Context Governor runtime closure (temporary)
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/context-governor-runtime-apply-once.yml'
permissions:
  contents: write
concurrency:
  group: context-governor-runtime-closure
  cancel-in-progress: false
jobs:
  apply:
    if: github.head_ref == 'repair/context-governor-runtime-closure-20260909' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v7
        with:
          version: '0.9.28'
      - name: Apply exact patch and run canonical focused gates
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, gzip, hashlib, pathlib, subprocess
          source = pathlib.Path('.cg-closure/runtime-integration.patch.b64')
          raw = gzip.decompress(base64.b64decode(source.read_text().strip(), validate=True))
          expected = '794d26b89a8b5a057914407c5f1e010bc249c34a189a71d956e13802298f5dc4'
          actual = hashlib.sha256(raw).hexdigest()
          if actual != expected:
              raise SystemExit(f'runtime patch digest mismatch: {actual}')
          subprocess.run(['git','apply','--check','--whitespace=fix','-'], input=raw, check=True)
          subprocess.run(['git','apply','--whitespace=fix','-'], input=raw, check=True)
          PY
          git diff --check
          uv sync --frozen --extra dev
          HERMES_PYTHON="$PWD/.venv/bin/python" scripts/run_tests.sh \
            tests/plugins/test_context_governor_protocol.py \
            tests/plugins/test_context_governor_fd_ownership.py \
            tests/plugins/test_context_governor_runtime_closure.py -q
          .venv/bin/python scripts/check-windows-footguns.py --all
          uvx --from ruff==0.15.10 ruff check \
            plugins/context_engine/_context_governor \
            tests/plugins/test_context_governor_protocol.py \
            tests/plugins/test_context_governor_fd_ownership.py \
            tests/plugins/test_context_governor_runtime_closure.py
          .venv/bin/python -m compileall -q plugins/context_engine/_context_governor tests/plugins
          git config user.name 'Ares Context Governor Closure'
          git config user.email 'ares-context-governor-closure@users.noreply.github.com'
          git add plugins/context_engine/_context_governor/__init__.py tests/plugins/test_context_governor_fd_ownership.py
          git commit -m 'fix(context-governor): enforce runtime settlement and bounded cancellation'
          git push origin HEAD:repair/context-governor-runtime-closure-20260909
