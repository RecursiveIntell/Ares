name: Publish Hermes-Ares structural reconciliation once

on:
  pull_request:
    branches: [main]
    types: [synchronize]

permissions:
  contents: write

jobs:
  publish:
    if: >-
      github.event.pull_request.number == 35 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'hermes-ares-recon'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: '3.11'
      - name: Reproduce and publish exact owner-preserving merge
        shell: bash
        run: |
          set -euo pipefail
          expected_upstream='2237be355906fbe6065ce1815711eee52b2d646e'
          expected_patch='ea3336f62696b54586f52a8d76630aca1956c1026f0ac208b9a51114e901a644'
          expected_patch_gz='60b02f2e0945515f807678cf329fc93dbe69365c78bbee6a647d20a2b9735103'
          expected_tree='0085da4d85ac61772b09c4b4947b49667315b44e'
          patch_gz="$RUNNER_TEMP/hermes-v0211-adapt.patch.gz"
          patch="$RUNNER_TEMP/hermes-v0211-adapt.patch"

          cat .recon/hermes-v0211-adapt.gz.part-* > "$patch_gz"
          test "$(sha256sum "$patch_gz" | awk '{print $1}')" = "$expected_patch_gz"
          gzip -dc "$patch_gz" > "$patch"
          test "$(sha256sum "$patch" | awk '{print $1}')" = "$expected_patch"

          git remote add hermes https://github.com/NousResearch/hermes-agent.git
          git fetch --no-tags hermes "$expected_upstream"
          test "$(git rev-parse FETCH_HEAD)" = "$expected_upstream"

          set +e
          git merge --no-commit -X ours --no-edit FETCH_HEAD
          merge_rc=$?
          set -e
          if [ "$merge_rc" -ne 0 ]; then
            unmerged="$(git diff --name-only --diff-filter=U)"
            test "$unmerged" = 'apps/desktop/src/plugins/hermes-bots/plugin.js'
          fi

          while IFS= read -r p; do
            [ -n "$p" ] || continue
            if git cat-file -e "FETCH_HEAD:$p" 2>/dev/null; then
              git checkout FETCH_HEAD -- "$p"
            else
              git rm -f --ignore-unmatch -- "$p"
            fi
          done <<'UPSTREAM_ONLY'
          agent/model_metadata.py
          agent/subagent_lifecycle.py
          agent/usage_pricing.py
          contributors/emails/yj2761@nyu.edu
          gateway/platforms/bluebubbles.py
          gateway/platforms/qqbot/adapter.py
          gateway/platforms/signal.py
          gateway/platforms/weixin.py
          gateway/platforms/yuanbao.py
          hermes_cli/mcp_startup.py
          hermes_cli/subcommands/dashboard.py
          plugins/platforms/discord/adapter.py
          plugins/platforms/feishu/adapter.py
          plugins/platforms/line/adapter.py
          plugins/platforms/matrix/adapter.py
          plugins/platforms/mattermost/adapter.py
          plugins/platforms/slack/adapter.py
          plugins/platforms/teams/adapter.py
          plugins/platforms/telegram/adapter.py
          plugins/platforms/wecom/adapter.py
          run_agent.py
          tests/gateway/test_async_media_cache.py
          tests/hermes_cli/test_fast_serve_launch.py
          tests/hermes_cli/test_serve_mcp_discovery_after_bind.py
          tests/state/test_no_locked_readers_gate.py
          tests/tools/test_file_operations.py
          tests/tools/test_file_operations_edge_cases.py
          tests/tools/test_file_ops_single_roundtrip.py
          tests/tools/test_mcp_death_supervisor.py
          tests/tools/test_mcp_npx_cached_bin.py
          tests/tools/test_osv_check.py
          tools/browser_tool.py
          tools/file_operations.py
          tools/mcp_death_supervisor.py
          tools/osv_check.py
          tools/process_registry.py
          UPSTREAM_ONLY

          git rm -f --ignore-unmatch apps/desktop/src/plugins/hermes-bots/plugin.js
          git add -A
          git apply --index --check "$patch"
          git apply --index "$patch"

          git rm -r -f .recon
          git rm -f .github/workflows/publish-hermes-ares-recon-once.yml
          git add -A

          test -z "$(git ls-files -u)"
          test -z "$(git diff --cached --name-only | grep '^ares_runtime/' || true)"
          git diff --cached --check
          test "$(git write-tree)" = "$expected_tree"

          mapfile -t changed_py < <(git diff --cached --name-only --diff-filter=ACMR -- '*.py')
          if [ "${#changed_py[@]}" -gt 0 ]; then
            python -m py_compile "${changed_py[@]}"
          fi

          git config user.name 'Ares Hermes Reconciliation'
          git config user.email 'ares-hermes-recon@users.noreply.github.com'
          git commit -m 'merge(upstream): reconcile Hermes v0.21.1 structural owners'
          test "$(git rev-parse HEAD^{tree})" = "$expected_tree"
          test "$(git rev-parse HEAD^2)" = "$expected_upstream"
          git push origin HEAD:hermes-ares-recon
