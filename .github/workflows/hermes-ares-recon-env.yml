name: Export pinned Hermes-Ares test environment

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  export-environment:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'hermes-ares-recon'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: NousResearch/hermes-agent
          ref: 2237be355906fbe6065ce1815711eee52b2d646e
          persist-credentials: false
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          version: '0.9.28'
      - name: Install the locked upstream test environment
        shell: bash
        run: |
          set -euo pipefail
          uv python install 3.11
          uv sync --locked --python 3.11 --extra all --extra dev --extra anthropic --extra mistral --extra fal --extra modal --extra daytona --extra hindsight --extra parallel-web
      - name: Package interpreter and dependencies, not credentials or user state
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/recon-env"
          mkdir -p "$out"
          python_root=$(.venv/bin/python -c 'import sys; print(sys.base_prefix)')
          test -f "$python_root/lib/python3.11/os.py"
          tar -czf "$out/python311.tar.gz" -C "$python_root" .
          tar -czf "$out/site-packages.tar.gz" -C .venv/lib/python3.11 site-packages
          .venv/bin/python -VV > "$out/python-version.txt"
          uv pip freeze --python .venv/bin/python > "$out/installed.txt"
          cp pyproject.toml uv.lock "$out/"
          git rev-parse HEAD > "$out/upstream-sha.txt"
          cd "$out"
          sha256sum python311.tar.gz site-packages.tar.gz pyproject.toml uv.lock > SHA256SUMS
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: hermes-ares-recon-test-environment
          path: ${{ runner.temp }}/recon-env/
          compression-level: 0
          retention-days: 7
          if-no-files-found: error
