name: Execution path conformance

# Reusable lane called from ci.yaml, gated on the ``exec_conformance``
# classifier lane (any file the gates read: product, test, or gate script).
# Formerly a standalone pull_request workflow with its own paths filter —
# folded into the orchestrator so the result is required by branch
# protection instead of advisory-only, and so one lane decision owns
# applicability (see classify_changes.py _EXEC_CONFORMANCE_PATHS).
#
# Reachable on demand via workflow_dispatch without running the full CI.

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  conformance-313:
    name: Execution path conformance (repo Python 3.14)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # 8.2.0
        with:
          # Pinned: unpinned setup-uv fetches a 'latest' manifest from
          # raw.githubusercontent.com every job; transient fetch failures
          # fail the job (2026-07-28 incident). Keep in sync with tests.yml.
          version: "0.9.28"
          # Persist uv's download/wheel cache across runs: without this the
          # full `uv sync` below re-downloads every dependency per run.
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock
      - name: Sync declared environment
        shell: bash
        run: |
          set -euo pipefail
          uv sync --frozen --extra dev --python 3.14
      - name: Run execution-path gates
        shell: bash
        run: |
          set -euo pipefail
          HERMES_PYTHON="$PWD/.venv/bin/python" scripts/run_tests.sh \
            tests/ares_runtime/test_execution_record.py \
            tests/ares_runtime/test_execution_record_digests.py \
            tests/ares_runtime/test_execution_record_binding.py \
            tests/ares_runtime/test_dispatch_governor_plugin.py \
            tests/ares_runtime/test_execution_path_ledger.py \
            tests/hermes_state/test_execution_record_store.py \
            tests/conformance/execution_path \
            tests/ares_runtime/test_continuity_dispatch.py \
            tests/agent/test_final_sdk_context_dispatch.py \
            tests/ares_runtime/test_context_input_lifetime.py \
            tests/gateway/test_context_input_recovery.py \
            -- -q
      - name: Upload conformance evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: execution-path-conformance-313
          path: |
            .pytest_cache
            tests/conformance/execution_path
          if-no-files-found: warn

  conformance-314-operator:
    name: Execution path conformance (operator Python 3.14, advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # 8.2.0
        with:
          # Pinned: unpinned setup-uv fetches a 'latest' manifest from
          # raw.githubusercontent.com every job; transient fetch failures
          # fail the job (2026-07-28 incident). Keep in sync with tests.yml.
          version: "0.9.28"
          # Persist uv's download/wheel cache across runs: without this the
          # full `uv sync` below re-downloads every dependency per run.
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock
      - name: Sync declared environment
        shell: bash
        run: |
          set -euo pipefail
          uv sync --frozen --extra dev --python 3.14
      - name: Run execution-path gates
        shell: bash
        run: |
          set -euo pipefail
          HERMES_PYTHON="$PWD/.venv/bin/python" scripts/run_tests.sh \
            tests/ares_runtime/test_execution_record.py \
            tests/ares_runtime/test_execution_record_digests.py \
            tests/ares_runtime/test_execution_record_binding.py \
            tests/ares_runtime/test_dispatch_governor_plugin.py \
            tests/ares_runtime/test_execution_path_ledger.py \
            tests/hermes_state/test_execution_record_store.py \
            tests/conformance/execution_path \
            -- -q
      - name: Upload operator-floor evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: execution-path-conformance-314
          path: |
            .pytest_cache
            tests/conformance/execution_path
          if-no-files-found: warn
