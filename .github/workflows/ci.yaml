name: CI

# Orchestrator workflow. Runs ``detect-changes`` once, then conditionally
# calls the sub-workflows that a PR can actually affect. A final
# ``all-checks-pass`` gate job aggregates results so branch protection only
# needs to require a single check.
#
# Sub-workflows are triggered via ``workflow_call`` and keep their own job
# definitions, matrices, and concurrency settings. They no longer have
# ``push:`` / ``pull_request:`` triggers of their own — everything flows
# through this file.
#
# SECURITY: this workflow runs PR-controlled actions, workflows, and code.
# Do not add ``secrets: inherit`` or GitHub App credentials here. Trusted
# main-only automation uses protected environments in its own workflows.

on:
  pull_request:
  push:
    branches: [main]
  # Merge queue: the queue tests the merged result on a temporary
  # merge_group ref. Without this trigger the queue waits forever for the
  # required aggregate check. The classifier fails open on merge_group
  # (like push): every lane runs, so the queued combination is fully
  # validated. PR-only jobs (history, lockfile-diff, supply-chain,
  # review-labels) skip via their event_name conditions and the evaluator
  # accepts merge_group explicitly.
  merge_group:
  # Operational recovery path: GitHub can occasionally terminate a push run
  # before any job is created. A maintainer must be able to re-run the exact
  # post-merge orchestration without manufacturing a source-only no-op commit.
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read # label reads for the review gate; comments post from ci-review-comment.yml (workflow_run) — Task 4.2
  actions: read # needed by osv-scanner (SARIF upload)
  security-events: write # needed by osv-scanner (SARIF upload)

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ─────────────────────────────────────────────────────────────────────
  # detect: run the classifier once. Every downstream job reads its outputs
  # to decide whether to run. On push/dispatch the classifier fails open
  # (all lanes true) so post-merge validation is never weakened.
  # ─────────────────────────────────────────────────────────────────────
  detect:
    name: Detect affected areas
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Task 4.2: explicit minimal — without this the job inherits the
    # workflow-level security-events: write (caller cap for the reusable
    # SARIF flow) while running PR-controlled classifier code.
    permissions:
      contents: read
    outputs:
      python: ${{ steps.classify.outputs.python }}
      python_prod: ${{ steps.classify.outputs.python_prod }}
      frontend: ${{ steps.classify.outputs.frontend }}
      site: ${{ steps.classify.outputs.site }}
      scan: ${{ steps.classify.outputs.scan }}
      deps: ${{ steps.classify.outputs.deps }}
      uv_lock: ${{ steps.classify.outputs.uv_lock }}
      npm_lock: ${{ steps.classify.outputs.npm_lock }}
      installer: ${{ steps.classify.outputs.installer }}
      rust: ${{ steps.classify.outputs.rust }}
      docker_meta: ${{ steps.classify.outputs.docker_meta }}
      mcp_catalog: ${{ steps.classify.outputs.mcp_catalog }}
      ci_review: ${{ steps.classify.outputs.ci_review }}
      ci_review_files: ${{ steps.classify.outputs.ci_review_files }}
      context_continuity: ${{ steps.classify.outputs.context_continuity }}
      current_owner_integration: ${{ steps.classify.outputs.current_owner_integration }}
      exec_conformance: ${{ steps.classify.outputs.exec_conformance }}
      event_name: ${{ github.event_name }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Detect affected areas
        id: classify
        uses: ./.github/actions/detect-changes
        with:
          github-token: ${{ github.token }}

  # ─────────────────────────────────────────────────────────────────────
  # Lane-gated sub-workflows. Each runs in parallel after detect finishes.
  # Skipped workflows (if condition is false) don't spin up runners.
  # ─────────────────────────────────────────────────────────────────────
  tests:
    name: Python tests
    # Task 4.2: explicit minimal map - no inherited write scopes.
    permissions:
      contents: read

    needs: detect
    if: needs.detect.outputs.python == 'true'
    uses: ./.github/workflows/tests.yml
    with:
      slice_count: 12

  # macOS + Windows lanes. The main `tests` lane above is Linux-only, and
  # the OS-marked tests it collects are skipped there by design (see the
  # `_OS_MARKS` comment in tests/conftest.py) — this is where they run.
  # Same `python` lane gate: if no Python changed, neither runs.
  tests-os:
    name: OS-specific tests
    # Task 4.2: explicit minimal map - no inherited write scopes.
    permissions:
      contents: read

    needs: detect
    if: needs.detect.outputs.python == 'true'
    uses: ./.github/workflows/tests-os.yml

  lint:
    name: Python lints
    # Task 4.2: explicit minimal map - no inherited write scopes.
    permissions:
      contents: read

    needs: detect
    if: needs.detect.outputs.python == 'true'
    uses: ./.github/workflows/lint.yml
    with:
      event_name: ${{ needs.detect.outputs.event_name }}

  js-tests:
    name: JS & TS checks
    # Task 4.2: explicit minimal map - no inherited write scopes.
    permissions:
      contents: read

    needs: detect
    if: needs.detect.outputs.frontend == 'true'
    uses: ./.github/workflows/js-tests.yml

  installer-tests:
    name: Installer tests
    # Task 4.2: explicit minimal map - no inherited write scopes.
    permissions:
      contents: read

    needs: detect
    # Windows-only, and only for PRs that touch install.ps1 or its tests.
    if: needs.detect.outputs.installer == 'true'
    uses: ./.github/workflows/installer-tests.yml

  rust-tests:
    name: Rust tests
    # Task 4.2: explicit minimal map - no inherited write scopes.
    permissions:
      contents: read

    needs: detect
    # Only for PRs that touch a Rust crate. `.rs` is under apps/, so these
    # changes used to run the TypeScript matrix and nothing that compiles them.
    if: needs.detect.outputs.rust == 'true'
    uses: ./.github/workflows/rust-tests.yml

  # Preserve the existing native owners and exact pairing. PR-controlled
  # qualification receives only read access, without inherited secrets.
  context-continuity:
    name: Context continuity qualification
    needs: detect
    if: needs.detect.outputs.context_continuity == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/context-continuity-qualification.yml

  current-owner-integration:
    name: Current owner integration
    needs: detect
    if: needs.detect.outputs.current_owner_integration == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/current-owner-integration.yml

  exec-conformance:
    name: Execution path conformance
    needs: detect
    if: needs.detect.outputs.exec_conformance == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/execution-path-conformance.yml

  # Desktop E2E lane removed (Nov 2026): the suite was parked with
  # `if: false` since Aug 2, 2026 (tracking issue #76627) and the lane
  # evaluated a job that could never run. e2e-desktop.yml remains
  # workflow_dispatch-capable for on-demand native security witnesses;
  # re-admit it as a lane via a separate workflow admission decision once
  # #76627 is resolved.

  docs-site:
    name: Docs Site
    # Task 4.2: explicit minimal map - no inherited write scopes.
    permissions:
      contents: read

    needs: detect
    if: needs.detect.outputs.site == 'true'
    uses: ./.github/workflows/docs-site-checks.yml

  history-check:
    name: Deny unrelated histories
    # Task 4.2: explicit minimal map - no inherited write scopes.
    permissions:
      contents: read

    needs: detect
    if: needs.detect.outputs.event_name == 'pull_request'
    uses: ./.github/workflows/history-check.yml

  contributor-check:
    name: Check contributors
    # Task 4.2: explicit minimal map - no inherited write scopes.
    permissions:
      contents: read

    needs: detect
    if: needs.detect.outputs.python == 'true'
    uses: ./.github/workflows/contributor-check.yml

  uv-lockfile:
    name: Check uv.lock
    # Task 4.2: explicit minimal map - no inherited write scopes.
    permissions:
      contents: read

    needs: detect
    # Gated: `uv lock --check` re-resolves the whole dependency graph against
    # PyPI, so on every PR it spent a network round-trip — and, on a registry
    # blip, a blocking red X — for diffs that cannot desync the lockfile
    # (docs, frontend, prose). Only pyproject.toml / uv.lock can. A
    # `.github/` change still forces it on via the classifier's fail-open.
    if: needs.detect.outputs.uv_lock == 'true'
    uses: ./.github/workflows/uv-lockfile-check.yml

  infographic-check:
    name: Check no committed infographics
    # Task 4.2: explicit minimal map - no inherited write scopes.
    permissions:
      contents: read

    needs: detect
    uses: ./.github/workflows/infographic-check.yml

  lockfile-diff:
    name: package-lock.json diff
    # Task 4.2: explicit minimal map - no inherited write scopes.
    permissions:
      contents: read

    needs: detect
    if: needs.detect.outputs.event_name == 'pull_request' && needs.detect.outputs.npm_lock == 'true'
    uses: ./.github/workflows/lockfile-diff.yml

  docker-lint:
    name: Lint Docker scripts
    # Task 4.2: explicit minimal map - no inherited write scopes.
    permissions:
      contents: read

    needs: detect
    if: needs.detect.outputs.docker_meta == 'true'
    uses: ./.github/workflows/docker-lint.yml

  supply-chain:
    name: Supply-chain scan
    needs: detect
    if: needs.detect.outputs.event_name == 'pull_request' && (needs.detect.outputs.scan == 'true' || needs.detect.outputs.deps == 'true')
    # The callee requests pull-requests: read (label/status reads); the
    # caller cap must grant at least that. Read-only on PR code — Task 4.2.
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/supply-chain-audit.yml
    with:
      event_name: ${{ needs.detect.outputs.event_name }}
      scan: ${{ needs.detect.outputs.scan == 'true' }}
      deps: ${{ needs.detect.outputs.deps == 'true' }}

  review-labels:
    name: Review label gate
    # Task 4.2: explicit minimal map - no inherited write scopes. The callee
    # reads PR labels, so the caller cap must grant pull-requests: read.
    permissions:
      contents: read
      pull-requests: read

    needs: [detect, supply-chain]
    if: always() && needs.detect.outputs.event_name == 'pull_request' && (needs.detect.outputs.ci_review == 'true' || needs.detect.outputs.mcp_catalog == 'true' || needs.supply-chain.outputs.critical_findings == 'true')
    uses: ./.github/workflows/review-labels.yml
    with:
      ci_review: ${{ needs.detect.outputs.ci_review == 'true' }}
      ci_review_files: ${{ needs.detect.outputs.ci_review_files }}
      mcp_catalog: ${{ needs.detect.outputs.mcp_catalog == 'true' }}
      supply_chain: ${{ needs.supply-chain.outputs.critical_findings == 'true' }}

  osv-scanner:
    name: OSV scan
    uses: ./.github/workflows/osv-scanner.yml
    # Caller cap: GitHub requires the calling job to grant every scope the
    # callee requests. security-events: write executes in the callee's SARIF
    # upload job, not on PR code (Task 4.2; verified 2026-10-26 round 3).
    permissions:
      contents: read
      actions: read
      security-events: write

  # ─────────────────────────────────────────────────────────────────────
  # Gate: runs after everything. ``if: always()`` ensures it reports a
  # terminal status even when dependencies fail or are skipped. The evaluator
  # enforces the classifier-derived applicability contract: applicable jobs
  # must succeed, non-applicable jobs must be explicitly skipped, and missing,
  # malformed, cancelled, or unexpected required-job results fail closed.
  #
  # Branch protection should require ONLY this check.
  #
  # Outputs ``needs-json`` — a compact ``{job_name: result}`` dict — so
  # the live comment poller can list failed jobs in the PR comment.
  # ─────────────────────────────────────────────────────────────────────
  all-checks-pass:
    name: All required checks pass
    # This job executes the PR-controlled evaluator; do not inherit the
    # workflow-wide permissions needed by unrelated reporting jobs.
    permissions:
      contents: read
    needs:
      - detect
      - tests
      - tests-os
      - lint
      - js-tests
      - installer-tests
      - rust-tests
      - context-continuity
      - current-owner-integration
      - exec-conformance
      - docs-site
      - history-check
      - contributor-check
      - uv-lockfile
      - infographic-check
      - lockfile-diff
      - docker-lint
      - supply-chain
      - review-labels
      - osv-scanner
      # The image build runs in its own workflow (docker.yml) and reports
      # its own check. It was never required here, because it is too slow
      # to block a merge. A separate run also stops it from holding this
      # run open. That is what blocked ``gh run rerun``.
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      needs-json: ${{ steps.evaluate.outputs.needs-json }}
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Restore cached actionlint
        id: actionlint-cache
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: actionlint
          # Pinned to the version below: a bump must change both places.
          key: actionlint-1.7.11-linux-amd64
      - name: Install pinned actionlint
        if: steps.actionlint-cache.outputs.cache-hit != 'true'
        env:
          ACTIONLINT_VERSION: 1.7.11
          ACTIONLINT_SHA256: 900919a84f2229bac68ca9cd4103ea297abc35e9689ebb842c6e34a3d1b01b0a
        run: |
          set -euo pipefail
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          url="https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${archive}"
          python3 - "$archive" "$url" <<'PY'
          import pathlib
          import sys
          import time
          import urllib.error
          import urllib.request

          destination = pathlib.Path(sys.argv[1])
          request = urllib.request.Request(sys.argv[2], headers={"User-Agent": "RecursiveIntell-actionlint"})
          for attempt in range(1, 4):
              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      destination.write_bytes(response.read())
                  break
              except (OSError, urllib.error.URLError):
                  if attempt == 3:
                      raise
                  time.sleep(attempt * 2)
          PY
          printf '%s  %s\n' "$ACTIONLINT_SHA256" "$archive" | sha256sum --check --status -
          tar -xzf "$archive" actionlint
          chmod 0755 actionlint

      - name: Save actionlint cache
        if: steps.actionlint-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: actionlint
          key: actionlint-1.7.11-linux-amd64

      - name: Lint GitHub Actions workflows
        # Lint the planner and every lane the aggregate enforces, including
        # lanes added after the original CI-01 plan. Other workflows retain
        # their existing independent lint ownership.
        run: >-
          ./actionlint
          .github/workflows/ci.yaml
          .github/workflows/context-continuity-qualification.yml
          .github/workflows/current-owner-integration.yml
          .github/workflows/execution-path-conformance.yml
          .github/workflows/nix.yml
          .github/workflows/docker.yml
          .github/workflows/osv-scanner.yml

      - name: Workflow token-permission check (Task 4.2)
        run: python3 scripts/ci/check_workflow_permissions.py

      - name: Evaluate job results
        id: evaluate
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          CLASSIFIER_JSON: ${{ toJSON(needs.detect.outputs) }}
          EVENT_NAME: ${{ github.event_name }}
        run: python3 scripts/ci/evaluate_required_checks.py

  # ─────────────────────────────────────────────────────────────────────
  # CI timing report: runs on main pushes (baseline) and on demand
  # (workflow_dispatch). Skipped on PRs and merge-queue runs: every PR
  # used to pay a GitHub API sweep + artifact upload for a report whose
  # baseline only changes on main. The live comment poller tolerates the
  # missing review-status-ci-timings artifact (dynamic fetch).
  # ─────────────────────────────────────────────────────────────────────
  ci-timings:
    name: CI timing report
    needs: [all-checks-pass]
    if: always() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Task 4.2: explicit minimal — no inherited write scopes on PR-checkout jobs.
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Restore baseline cache (PR only)
        if: github.event_name == 'pull_request'
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ci-timings-baseline.json
          # Prefix-match: exact key will never hit (run_id differs), so
          # restore-keys finds the most recent baseline from main.
          key: ci-timings-baseline-never-exact
          restore-keys: |
            ci-timings-baseline-

      - name: Collect timings and generate report
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/ci/timings_report.py \
            --baseline ci-timings-baseline.json \
            --output ci-timings-report.html \
            --json-out ci-timings.json \
            --summary-out ci-timings-summary.md

      - name: Upload HTML report
        # Advisory report — artifact-service blips must not fail the job.
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        id: ci-timings-html
        with:
          name: ci-timings-report
          path: ci-timings-report.html
          retention-days: 14

      - name: Build linked review status
        if: hashFiles('ci-timings.json') != ''
        env:
          CI_TIMINGS_REPORT_URL: ${{ steps.ci-timings-html.outputs.artifact-url }}
        run: |
          python3 scripts/ci/timings_report.py \
            --from-json ci-timings.json \
            --baseline ci-timings-baseline.json \
            --review-status-out review-status.json \
            --review-status-only

      - name: Upload review status
        if: hashFiles('review-status.json') != ''
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: review-status-ci-timings
          path: review-status.json
          retention-days: 14

      - name: Output summary
        env:
          REPORT_URL: ${{ steps.ci-timings-html.outputs.artifact-url}}
        run: |
          {
            echo "# CI Timing report"
            echo "[View the full interactive report]($REPORT_URL)"
          } >> "$GITHUB_STEP_SUMMARY"
          cat ci-timings-summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Save baseline cache (main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          # Degraded runs (API rate-limited) produce no ci-timings.json —
          # skip rather than fail, and never cache an empty baseline.
          if [ -f ci-timings.json ]; then
            cp ci-timings.json ci-timings-baseline.json
          else
            echo "No timings JSON this run — skipping baseline update"
          fi

      - name: Upload baseline to cache (main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && hashFiles('ci-timings-baseline.json') != ''
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ci-timings-baseline.json
          key: ci-timings-baseline-${{ github.run_id }}
