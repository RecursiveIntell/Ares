name: Report scheduled CI failures

# Plan Task 1.5: opens or updates ONE tracked issue when a scheduled run of
# the calling workflow fails, and closes it on the next fully green run.
# No silent red: if the issue API path itself fails, this job fails, so the
# run shows a second red job instead of a silent gap (X-11).
on:
  workflow_call:
    inputs:
      workflow-name:
        description: 'Display name of the calling workflow (issue title key)'
        required: true
        type: string

jobs:
  report:
    name: Report failures
    runs-on: ubuntu-latest
    if: always()
    permissions:
      issues: write
      contents: read
      actions: read
    steps:
      - name: Open, update, or close the failure issue
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          WF: ${{ inputs.workflow-name }}
          RUN_ID: ${{ github.run_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          LABEL: ci-scheduled-failure
        run: |
          set -euo pipefail

          # ── 1. Inspect every job of this run ────────────────────────────
          gh api "repos/$REPO/actions/runs/$RUN_ID/jobs?per_page=100" --jq '
            .jobs[] | [(.name // "?"), (.conclusion // "unknown")] | @tsv
          ' > jobs.tsv
          total="$(wc -l < jobs.tsv)"
          failed="$(awk -F'\t' '$2=="failure" || $2=="timed_out" || $2=="cancelled"' jobs.tsv | wc -l)"
          green=1
          [ "$total" -gt 0 ] || green=0
          [ "$failed" -eq 0 ] || green=0
          echo "jobs=$total failed=$failed green=$green"

          # ── 2. Find the open tracked issue for this workflow ────────────
          title="[$LABEL] $WF"
          existing="$(gh api -X GET search/issues \
            -f q="repo:$REPO is:open label:$LABEL in:title \"$title\"" \
            --jq '.items[0].number' 2>/dev/null || echo "")"

          # ── 3. Green: close the issue; red: open or update it ───────────
          if [ "$green" -eq 1 ]; then
            if [ -n "$existing" ]; then
              gh issue close "$existing" --repo "$REPO" \
                --comment "Recovered: run $RUN_ID is fully green ($total jobs); closing the tracked failure issue."
              echo "closed issue #$existing"
            else
              echo "run green; no open failure issue"
            fi
            exit 0
          fi

          body="$(mktemp)"
          {
            echo "Scheduled run of **$WF** failed."
            echo ""
            echo "- Run: $RUN_URL"
            echo "- Failed: $failed of $total jobs"
            echo ""
            echo "| job | conclusion |"
            echo "|---|---|"
            if [ "$total" -eq 0 ]; then
              echo "| (no job records available for this run — startup-level failure) | - |"
            fi
            while IFS=$'\t' read -r name conclusion; do
              case "$conclusion" in
                failure|timed_out|cancelled) echo "| $name | $conclusion |" ;;
              esac
            done < jobs.tsv
            echo ""
            echo "<!-- ares-report-scheduled v1; auto-managed: closed on next green run -->"
          } > "$body"

          if [ -n "$existing" ]; then
            gh issue edit "$existing" --repo "$REPO" \
              --body-file "$body" >/dev/null
            gh issue comment "$existing" --repo "$REPO" \
              --body "Still failing at run $RUN_ID ($failed/$total jobs failed)." >/dev/null
            echo "updated issue #$existing"
          else
            gh issue create --repo "$REPO" \
              --title "$title" \
              --body-file "$body" \
              --label "$LABEL" >/dev/null
            echo "opened new failure issue"
          fi
