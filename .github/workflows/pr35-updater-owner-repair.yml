name: PR35 updater-owner repair

on:
  push:
    branches: [hermes-ares-recon]

permissions:
  contents: write

concurrency:
  group: pr35-updater-owner-repair
  cancel-in-progress: false

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout exact reconciliation branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: hermes-ares-recon
          fetch-depth: 2

      - name: Verify exact preflight and fetch pinned Hermes tree
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "ab51522ab62343337fe7399988c4101f0a0e7b6c"
          test "$(git hash-object hermes_cli/update_cmd.py)" = "1b04c61081216c371a1ec6d6cf260a42356d62a7"
          test -z "$(git status --porcelain)"
          git fetch --no-tags --depth=1 origin 2237be355906fbe6065ce1815711eee52b2d646e
          git cat-file -e 2237be355906fbe6065ce1815711eee52b2d646e^{commit}

      - name: Remove stale updater shadows
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from __future__ import annotations

          import ast
          import subprocess
          from pathlib import Path

          PIN = "2237be355906fbe6065ce1815711eee52b2d646e"
          path = Path("hermes_cli/update_cmd.py")
          text = path.read_text(encoding="utf-8")
          tree = ast.parse(text)
          pinned_text = subprocess.check_output(
              ["git", "show", f"{PIN}:hermes_cli/update_cmd.py"],
              text=True,
              encoding="utf-8",
          )
          pinned_tree = ast.parse(pinned_text)

          def defs_by_name(module: ast.Module):
              result = {}
              for node in module.body:
                  if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef, ast.ClassDef)):
                      result.setdefault(node.name, []).append(node)
              return result

          current_defs = defs_by_name(tree)
          pinned_defs = set(defs_by_name(pinned_tree))

          imported_owners: dict[str, tuple[str, str]] = {}
          for node in tree.body:
              if not isinstance(node, ast.ImportFrom) or not node.module:
                  continue
              if not node.module.startswith("hermes_cli.update_"):
                  continue
              for alias in node.names:
                  if alias.name == "*":
                      raise SystemExit(f"wildcard split-owner import is unsupported: {node.module}")
                  local = alias.asname or alias.name
                  previous = imported_owners.get(local)
                  owner = (node.module, alias.name)
                  if previous is not None and previous != owner:
                      raise SystemExit(f"ambiguous updater owner for {local}: {previous} vs {owner}")
                  imported_owners[local] = owner

          candidates = []
          for name, nodes in current_defs.items():
              if name not in imported_owners or name in pinned_defs:
                  continue
              if len(nodes) != 1:
                  raise SystemExit(f"ambiguous top-level shadow {name}: {len(nodes)} definitions")
              module_name, source_name = imported_owners[name]
              owner_path = Path(*module_name.split(".")).with_suffix(".py")
              if not owner_path.is_file():
                  raise SystemExit(f"owner module missing for {name}: {owner_path}")
              owner_tree = ast.parse(owner_path.read_text(encoding="utf-8"))
              bindings = set()
              for owner_node in owner_tree.body:
                  if isinstance(owner_node, (ast.FunctionDef, ast.AsyncFunctionDef, ast.ClassDef)):
                      bindings.add(owner_node.name)
                  elif isinstance(owner_node, ast.ImportFrom):
                      bindings.update(a.asname or a.name for a in owner_node.names if a.name != "*")
                  elif isinstance(owner_node, ast.Import):
                      bindings.update(a.asname or a.name.split(".")[0] for a in owner_node.names)
                  elif isinstance(owner_node, (ast.Assign, ast.AnnAssign)):
                      targets = owner_node.targets if isinstance(owner_node, ast.Assign) else [owner_node.target]
                      for target in targets:
                          if isinstance(target, ast.Name):
                              bindings.add(target.id)
              if source_name not in bindings:
                  raise SystemExit(
                      f"cannot prove extracted owner binding for {name}: "
                      f"{module_name}.{source_name} not bound in {owner_path}"
                  )
              candidates.append((name, nodes[0], module_name, source_name))

          if not candidates:
              raise SystemExit("no updater shadow candidates found; refusing no-op structural rewrite")
          names = {name for name, *_ in candidates}
          if "_zip_overlay_block_reason" not in names:
              raise SystemExit(
                  f"expected known stale owner _zip_overlay_block_reason; candidates={sorted(names)}"
              )

          print("verified stale updater shadows:")
          for name, _node, module_name, source_name in sorted(candidates):
              print(f"  {name} -> {module_name}.{source_name}")

          lines = text.splitlines(keepends=True)
          for _name, node, _module_name, _source_name in sorted(
              candidates, key=lambda item: item[1].lineno, reverse=True
          ):
              decorator_lines = [d.lineno for d in getattr(node, "decorator_list", [])]
              start_line = min([node.lineno, *decorator_lines]) - 1
              end_line = node.end_lineno
              del lines[start_line:end_line]

          repaired = "".join(lines)
          path.write_text(repaired, encoding="utf-8")

          repaired_tree = ast.parse(repaired)
          repaired_defs = defs_by_name(repaired_tree)
          remaining = sorted(names & set(repaired_defs))
          if remaining:
              raise SystemExit(f"stale updater shadows remain after repair: {remaining}")
          PY

      - name: Validate updater ownership
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile hermes_cli/update_cmd.py hermes_cli/update_*.py
          python3 - <<'PY'
          import ast
          from pathlib import Path

          tree = ast.parse(Path("hermes_cli/update_cmd.py").read_text(encoding="utf-8"))
          defined = {
              node.name
              for node in tree.body
              if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef, ast.ClassDef))
          }
          if "_zip_overlay_block_reason" in defined:
              raise SystemExit("update_cmd.py still shadows update_cmd_zip._zip_overlay_block_reason")
          PY
          git diff --check
          git diff --stat

      - name: Commit repair and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Josh Stevenson"
          git config user.email "J.stevenson.cs@gmail.com"
          git rm .github/workflows/pr35-updater-owner-repair.yml
          git add hermes_cli/update_cmd.py
          git diff --cached --check
          git diff --cached --stat
          git commit -m "fix(reconcile): restore updater module ownership"
          git push origin HEAD:hermes-ares-recon
