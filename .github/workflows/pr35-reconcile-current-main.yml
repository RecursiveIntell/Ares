name: PR35 reconcile current main

on:
  push:
    branches: [hermes-ares-recon]

permissions:
  contents: write

concurrency:
  group: pr35-reconcile-current-main
  cancel-in-progress: false

jobs:
  reconcile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact reconciliation branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: hermes-ares-recon
          fetch-depth: 0

      - name: Verify pinned heads
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "932b0f60080e1203f959f37b28df1cc5c5759b40"
          git fetch --no-tags origin main
          test "$(git rev-parse origin/main)" = "0451a66cbb765a3ede359660e37b1b2fbe857525"
          test -z "$(git status --porcelain)"

      - name: Reconcile current main with conflict-hunk precedence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Josh Stevenson"
          git config user.email "J.stevenson.cs@gmail.com"
          git merge --no-ff --no-commit -X theirs 0451a66cbb765a3ede359660e37b1b2fbe857525
          test -z "$(git diff --name-only --diff-filter=U)"
          git diff --check

      - name: Restore current-main hermes_state owners
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("hermes_state.py")
          text = path.read_text(encoding="utf-8")

          activity_anchor = "from agent.message_sanitization import _sanitize_surrogates\n"
          activity_owner = "from agent.session_activity import ActivityProvenance\n"
          activity_expected = activity_anchor + activity_owner
          if activity_expected not in text:
              if text.count(activity_anchor) != 1:
                  raise SystemExit("unexpected hermes_state message-sanitization import shape")
              text = text.replace(activity_anchor, activity_expected, 1)

          common_import = "from hermes_state_common import escape_like as _escape_like, stat_db_file_identity as _stat_db_file_identity\n"
          common_expected = (
              "from hermes_state_common import (\n"
              "    _RECOVERABLE_END_REASONS,\n"
              "    escape_like as _escape_like,\n"
              "    stat_db_file_identity as _stat_db_file_identity,\n"
              ")\n"
          )
          if common_expected not in text:
              if text.count(common_import) != 1:
                  raise SystemExit("unexpected hermes_state_common import shape")
              text = text.replace(common_import, common_expected, 1)

          path.write_text(text, encoding="utf-8")
          checked = path.read_text(encoding="utf-8")
          if activity_expected not in checked:
              raise SystemExit("top-level ActivityProvenance owner was not restored")
          if common_expected not in checked:
              raise SystemExit("recoverable end-reason owner was not restored")
          PY
          git add hermes_state.py
          git diff --cached --check
          echo "Reconciled paths:"
          git diff --cached --name-status
          echo "Reconciliation stat:"
          git diff --cached --stat

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # 8.2.0
        with:
          version: "0.9.28"
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock

      - name: Set up Python 3.11
        shell: bash
        run: |
          set -euo pipefail
          uv python install 3.11
          uv sync --locked --python 3.11 --extra all --extra dev --extra anthropic --extra mistral --extra fal --extra modal --extra daytona --extra hindsight --extra parallel-web

      - name: Validate main-owned reconciliation surfaces
        shell: bash
        run: |
          set -euo pipefail
          source .venv/bin/activate
          python - <<'PY'
          import hermes_state
          assert hermes_state.SessionDB.RECOVERABLE_END_REASONS == hermes_state._RECOVERABLE_END_REASONS
          PY
          python -m pytest -q \
            tests/agent/test_context_governor_restore.py \
            tests/ares_runtime/test_managed_calls.py \
            tests/hermes_cli/test_goal_lifecycle_contract.py \
            tests/plugins/test_context_governor_fd_ownership.py \
            tests/plugins/test_context_governor_protocol.py \
            tests/plugins/test_context_governor_runtime_closure.py \
            tests/test_hermes_state.py \
            tests/test_tui_gateway_server.py

      - name: Commit reconciliation
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/pr35-reconcile-current-main.yml
          git add -A
          git diff --cached --check
          git commit -m "merge(main): reconcile PR 35 with current Ares main"
          git push origin HEAD:hermes-ares-recon
