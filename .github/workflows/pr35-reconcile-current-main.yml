name: PR35 reconcile current main

on:
  push:
    branches: [hermes-ares-recon]

permissions:
  contents: write

concurrency:
  group: pr35-reconcile-current-main
  cancel-in-progress: true

jobs:
  reconcile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact reconciliation branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: hermes-ares-recon
          fetch-depth: 0

      - name: Verify pinned heads
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "15140675180ee068dd24d6da5a78c666c9d2dc81"
          git fetch --no-tags origin main
          test "$(git rev-parse origin/main)" = "94a17d17521d92407b6418e57e755e279e40cc6f"
          test -z "$(git status --porcelain)"

      - name: Merge pinned current main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Josh Stevenson"
          git config user.email "J.stevenson.cs@gmail.com"
          git merge --no-ff --no-commit -X theirs 94a17d17521d92407b6418e57e755e279e40cc6f
          test -z "$(git diff --name-only --diff-filter=U)"
          git diff --check

      - name: Apply deterministic owner reconciliation
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/pr35_reconcile.py
          python3 .github/pr35_reconcile_state_support.py
          python3 .github/pr35_reconcile_state_ownership.py
          git add hermes_state.py hermes_cli/goals.py tests/hermes_cli/test_goals.py
          git diff --cached --check

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          version: "0.9.28"
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock

      - name: Set up Python 3.11
        shell: bash
        run: |
          set -euo pipefail
          uv python install 3.11
          uv sync --locked --python 3.11 --extra all --extra dev --extra anthropic --extra mistral --extra fal --extra modal --extra daytona --extra hindsight --extra parallel-web

      - name: Validate reconciled owner contracts
        shell: bash
        run: |
          set -euo pipefail
          source .venv/bin/activate
          python - <<'PY'
          import inspect
          import hermes_state
          import agent.context_compressor as context_compressor
          import agent.memory_manager as memory_manager
          from hermes_cli.goals import GoalManager
          from hermes_state_gateway import SessionGatewayMixin
          from hermes_state_maintenance import SessionMaintenanceMixin
          from hermes_state_messages import SessionMessagesMixin
          from hermes_state_sessions import SessionSessionsMixin
          from hermes_state_telegram import SessionTelegramTopicsMixin

          assert hermes_state.SessionDB.RECOVERABLE_END_REASONS == hermes_state._RECOVERABLE_END_REASONS
          assert hermes_state._DB_PERSISTED_MARKER_KEY == context_compressor._DB_PERSISTED_MARKER
          assert hermes_state.sanitize_context is memory_manager.sanitize_context
          assert callable(hermes_state._stat_db_file_identity)
          assert callable(hermes_state._escape_like)
          assert "active_delegations" in inspect.signature(GoalManager.evaluate_after_turn).parameters
          for name in (
              "_MODEL_CONFIG_ROW_MISSING",
              "_cwd_prefix_clause",
              "_workspace_key_clause",
              "_collect_delegate_child_ids",
              "_delete_delegate_children",
              "_delegate_from_json",
              "classify_session_status",
              "workspace_key",
              "_LISTABLE_CHILD_SQL",
              "_RECOVERABLE_END_REASONS_SQL",
              "_RESET_END_REASONS_SQL",
              "_sql_session_last_active",
              "_sql_session_last_active_by_id",
          ):
              assert hasattr(hermes_state, name), name

          modular_owners = {
              "_insert_session_row": SessionSessionsMixin,
              "list_sessions_rich": SessionSessionsMixin,
              "apply_telegram_topic_migration": SessionTelegramTopicsMixin,
              "find_latest_gateway_session_for_peer": SessionGatewayMixin,
              "maybe_auto_prune_and_vacuum": SessionMaintenanceMixin,
              "get_resume_message_count": SessionMessagesMixin,
          }
          for name, owner in modular_owners.items():
              assert name not in hermes_state.SessionDB.__dict__, name
              assert getattr(hermes_state.SessionDB, name) is getattr(owner, name), name
          PY

      - name: Test context governor restore
        shell: bash
        run: source .venv/bin/activate && python -m pytest -q tests/agent/test_context_governor_restore.py

      - name: Test Ares managed calls
        shell: bash
        run: source .venv/bin/activate && python -m pytest -q tests/ares_runtime/test_managed_calls.py

      - name: Test goal lifecycle and regression witnesses
        shell: bash
        run: source .venv/bin/activate && python -m pytest -q tests/hermes_cli/test_goal_lifecycle_contract.py tests/hermes_cli/test_goals.py

      - name: Test context governor fd ownership
        shell: bash
        run: source .venv/bin/activate && python -m pytest -q tests/plugins/test_context_governor_fd_ownership.py

      - name: Test context governor protocol
        shell: bash
        run: source .venv/bin/activate && python -m pytest -q tests/plugins/test_context_governor_protocol.py

      - name: Test context governor runtime closure
        shell: bash
        run: source .venv/bin/activate && python -m pytest -q tests/plugins/test_context_governor_runtime_closure.py

      - name: Test reconciled SessionDB regression set
        shell: bash
        run: |
          set -euo pipefail
          source .venv/bin/activate
          python -m pytest -q \
            tests/test_hermes_state.py::TestSchemaInit::test_telegram_topic_binding_roundtrip_requires_explicit_schema \
            tests/test_hermes_state.py::TestCompressionChainProjection::test_list_serves_full_lineage_ids_for_projected_rows \
            tests/test_hermes_state.py::TestVacuum::test_auto_maintenance_skips_vacuum_below_freelist_ratio \
            tests/test_hermes_state.py::TestVacuum::test_auto_maintenance_vacuums_above_freelist_ratio \
            tests/test_hermes_state.py::TestVacuum::test_auto_maintenance_freelist_ratio_exactly_at_threshold_skips \
            tests/test_hermes_state.py::TestVacuum::test_auto_maintenance_unknown_freelist_ratio_falls_back_to_time_throttle \
            tests/test_hermes_state.py::TestVacuum::test_auto_maintenance_ratio_gate_threshold_is_overridable \
            tests/test_hermes_state.py::TestAutoMaintenance::test_first_run_prunes_and_skips_vacuum_when_little_reclaimable \
            tests/test_hermes_state.py::TestAutoMaintenance::test_first_run_prunes_and_vacuums_when_mostly_reclaimable \
            tests/test_hermes_state.py::test_peer_fallback_never_adopts_a_sibling_profiles_row \
            tests/test_hermes_state.py::test_child_inherits_parent_profile_only_within_its_key_namespace \
            tests/test_hermes_state.py::TestGetMessagesPagination::test_resume_safety_tip_only_counts_the_tip_segment \
            tests/test_hermes_state.py::TestGetMessagesPagination::test_resume_guard_counts_exactly_what_a_branch_resume_loads

      - name: Test hermes state full suite
        shell: bash
        run: |
          set -euo pipefail
          source .venv/bin/activate
          timeout 240s python -m pytest -vv tests/test_hermes_state.py

      - name: Test TUI gateway server
        shell: bash
        run: source .venv/bin/activate && python -m pytest -q tests/test_tui_gateway_server.py

      - name: Commit durable reconciliation
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/pr35-reconcile-current-main.yml .github/pr35_reconcile.py .github/pr35_reconcile_state_support.py .github/pr35_reconcile_state_ownership.py
          git add -A
          git diff --cached --check
          git commit -m "merge(main): reconcile PR 35 with current Ares main"
          git push origin HEAD:hermes-ares-recon
