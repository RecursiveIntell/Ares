name: PR35 reconcile current main

on:
  push:
    branches: [hermes-ares-recon]

permissions:
  contents: write

concurrency:
  group: pr35-reconcile-current-main
  cancel-in-progress: false

jobs:
  reconcile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact reconciliation branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: hermes-ares-recon
          fetch-depth: 0

      - name: Verify pinned heads
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "6e34f93899d952e577b2b7cf88c2addb93b249c5"
          git fetch --no-tags origin main
          test "$(git rev-parse origin/main)" = "0451a66cbb765a3ede359660e37b1b2fbe857525"
          test -z "$(git status --porcelain)"

      - name: Reconcile current main with conflict-hunk precedence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Josh Stevenson"
          git config user.email "J.stevenson.cs@gmail.com"
          git merge --no-ff --no-commit -X theirs 0451a66cbb765a3ede359660e37b1b2fbe857525
          test -z "$(git diff --name-only --diff-filter=U)"
          git diff --check

      - name: Restore current-main hermes_state owners
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path("hermes_state.py")
          text = path.read_text(encoding="utf-8")

          sanitize_import = "from agent.memory_manager import sanitize_context\n"
          activity_anchor = "from agent.message_sanitization import _sanitize_surrogates\n"
          activity_owner = "from agent.session_activity import ActivityProvenance\n"
          activity_expected = activity_anchor + activity_owner
          if sanitize_import not in text:
              if text.count(activity_anchor) != 1:
                  raise SystemExit("unexpected hermes_state message-sanitization import shape while restoring sanitize_context")
              text = text.replace(activity_anchor, sanitize_import + activity_anchor, 1)
          if activity_expected not in text:
              if text.count(activity_anchor) != 1:
                  raise SystemExit("unexpected hermes_state message-sanitization import shape")
              text = text.replace(activity_anchor, activity_expected, 1)

          marker_import = (
              "from agent.context_compressor import (\n"
              "    _DB_PERSISTED_MARKER as _DB_PERSISTED_MARKER_KEY,\n"
              ")\n"
          )
          marker_expected = activity_expected + marker_import
          if marker_import not in text:
              if text.count(activity_expected) != 1:
                  raise SystemExit("unexpected top-level ActivityProvenance import block while restoring DB marker owner")
              text = text.replace(activity_expected, marker_expected, 1)

          common_import = "from hermes_state_common import escape_like as _escape_like, stat_db_file_identity as _stat_db_file_identity\n"
          common_expected = (
              "from hermes_state_common import (\n"
              "    _RECOVERABLE_END_REASONS,\n"
              "    escape_like as _escape_like,\n"
              "    stat_db_file_identity as _stat_db_file_identity,\n"
              ")\n"
          )
          if common_expected not in text:
              if text.count(common_import) != 1:
                  raise SystemExit("unexpected hermes_state_common import shape")
              text = text.replace(common_import, common_expected, 1)

          path.write_text(text, encoding="utf-8")
          checked = path.read_text(encoding="utf-8")
          if sanitize_import not in checked:
              raise SystemExit("sanitize_context owner was not restored")
          if activity_expected not in checked:
              raise SystemExit("top-level ActivityProvenance owner was not restored")
          if marker_import not in checked:
              raise SystemExit("DB persisted marker owner was not restored")
          if common_expected not in checked:
              raise SystemExit("recoverable end-reason owner was not restored")
          PY
          git add hermes_state.py
          git diff --cached --check

      - name: Restore current-main GoalManager persistence contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import subprocess

          path = Path("hermes_cli/goals.py")
          merged = path.read_text(encoding="utf-8")
          main = subprocess.check_output(
              ["git", "show", "0451a66cbb765a3ede359660e37b1b2fbe857525:hermes_cli/goals.py"],
              text=True,
          )
          start = "    def set(self, goal: str, *, max_turns: Optional[int] = None, contract: Optional[GoalContract] = None) -> GoalState:\n"
          end = "    def add_collaboration_contract_ref(self, contract_ref: str) -> GoalState:\n"

          def block(text: str) -> str:
              if text.count(start) != 1 or text.count(end) != 1:
                  raise SystemExit("unexpected GoalManager set/set_contract ownership shape")
              a = text.index(start)
              b = text.index(end, a)
              return text[a:b]

          main_block = block(main)
          merged_block = block(merged)
          if "self._save()" in main_block:
              raise SystemExit("pinned main unexpectedly owns legacy GoalManager._save callsite")
          if merged_block != main_block:
              merged = merged.replace(merged_block, main_block, 1)
              path.write_text(merged, encoding="utf-8")
          checked = path.read_text(encoding="utf-8")
          if block(checked) != main_block:
              raise SystemExit("GoalManager persistence contract did not reconcile to pinned main")
          PY
          git add hermes_cli/goals.py
          git diff --cached --check

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          version: "0.9.28"
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock

      - name: Set up Python 3.11
        shell: bash
        run: |
          set -euo pipefail
          uv python install 3.11
          uv sync --locked --python 3.11 --extra all --extra dev --extra anthropic --extra mistral --extra fal --extra modal --extra daytona --extra hindsight --extra parallel-web

      - name: Validate hermes_state owner contract
        shell: bash
        run: |
          set -euo pipefail
          source .venv/bin/activate
          python - <<'PY'
          import hermes_state
          import agent.context_compressor as context_compressor
          import agent.memory_manager as memory_manager
          assert hermes_state.SessionDB.RECOVERABLE_END_REASONS == hermes_state._RECOVERABLE_END_REASONS
          assert hermes_state._DB_PERSISTED_MARKER_KEY == context_compressor._DB_PERSISTED_MARKER
          assert hermes_state.sanitize_context is memory_manager.sanitize_context
          PY

      - name: Test context governor restore
        id: context_governor
        shell: bash
        run: |
          set -uo pipefail
          source .venv/bin/activate
          log="$RUNNER_TEMP/context-governor-restore.log"
          python -m pytest -q --tb=short tests/agent/test_context_governor_restore.py 2>&1 | tee "$log"
          exit ${PIPESTATUS[0]}

      - name: Upload context governor failure log
        if: ${{ failure() && steps.context_governor.outcome == 'failure' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pr35-context-governor-failure
          path: ${{ runner.temp }}/context-governor-restore.log
          if-no-files-found: error
          retention-days: 1

      - name: Test Ares managed calls
        shell: bash
        run: source .venv/bin/activate && python -m pytest -q tests/ares_runtime/test_managed_calls.py

      - name: Test goal lifecycle contract
        shell: bash
        run: source .venv/bin/activate && python -m pytest -q tests/hermes_cli/test_goal_lifecycle_contract.py

      - name: Test context governor fd ownership
        shell: bash
        run: source .venv/bin/activate && python -m pytest -q tests/plugins/test_context_governor_fd_ownership.py

      - name: Test context governor protocol
        shell: bash
        run: source .venv/bin/activate && python -m pytest -q tests/plugins/test_context_governor_protocol.py

      - name: Test context governor runtime closure
        shell: bash
        run: source .venv/bin/activate && python -m pytest -q tests/plugins/test_context_governor_runtime_closure.py

      - name: Test hermes state
        shell: bash
        run: source .venv/bin/activate && python -m pytest -q tests/test_hermes_state.py

      - name: Test TUI gateway server
        shell: bash
        run: source .venv/bin/activate && python -m pytest -q tests/test_tui_gateway_server.py

      - name: Commit reconciliation
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/pr35-reconcile-current-main.yml
          git add -A
          git diff --cached --check
          git commit -m "merge(main): reconcile PR 35 with current Ares main"
          git push origin HEAD:hermes-ares-recon
