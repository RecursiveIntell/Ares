name: Current owner integration

on:
  workflow_call:
    outputs:
      profile_runtime_consumer_result:
        description: Result of the canonical owner to Ares consumer qualification.
        value: ${{ jobs.profile-runtime-consumer.outputs.qualification_result }}

permissions:
  contents: read

jobs:
  profile-runtime-consumer:
    outputs:
      qualification_result: ${{ job.status }}
    name: Current profile-runtime owner to Ares
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: ares
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: RecursiveIntell/Libraries
          ref: 9849d12adc8a5ef852d56e36abec4ffbb5122c62
          path: Libraries
          persist-credentials: false
      - name: Generate inputs with the exact current canonical Rust owner
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.94.0 --profile minimal
          mkdir -p Libraries/profile-runtime/examples "$RUNNER_TEMP/owner-evidence"
          cp ares/tests/owner_integration/profile_runtime_fixture.rs \
            Libraries/profile-runtime/examples/ares_policy_basis_fixture.rs
          cargo +1.94.0 test --locked --manifest-path Libraries/Cargo.toml \
            -p profile-runtime --test resolved_policy_basis
          cargo +1.94.0 run --locked --manifest-path Libraries/Cargo.toml \
            -p profile-runtime --example ares_policy_basis_fixture \
            > ares/tests/ares_runtime/fixtures/profile_runtime_v2_owner.json
          git -C Libraries rev-parse HEAD > "$RUNNER_TEMP/owner-evidence/libraries-head.txt"
          git -C ares rev-parse HEAD > "$RUNNER_TEMP/owner-evidence/ares-head.txt"
          cp ares/tests/ares_runtime/fixtures/profile_runtime_v2_owner.json \
            "$RUNNER_TEMP/owner-evidence/"
          sha256sum Libraries/target/debug/examples/ares_policy_basis_fixture \
            ares/tests/owner_integration/profile_runtime_fixture.rs \
            ares/tests/ares_runtime/fixtures/profile_runtime_v2_owner.json \
            > "$RUNNER_TEMP/owner-evidence/SHA256SUMS"
      - name: Build disposable semantic-memory owner peer
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p Libraries/semantic-memory/examples
          cp ares/tests/owner_integration/semantic_memory_revocation_owner.rs \
            Libraries/semantic-memory/examples/ares_revocation_owner.rs
          cargo +1.94.0 build --locked --manifest-path Libraries/Cargo.toml \
            -p semantic-memory --no-default-features --features brute-force \
            --example ares_revocation_owner
          cp Libraries/target/debug/examples/ares_revocation_owner \
            ares/tests/owner_integration/semantic_memory_revocation_owner
          sha256sum Libraries/target/debug/examples/ares_revocation_owner \
            ares/tests/owner_integration/semantic_memory_revocation_owner.rs \
            >> "$RUNNER_TEMP/owner-evidence/SHA256SUMS"
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        with:
          version: '0.9.28'
      - name: Exercise actual Ares materialization and consume-time owner checks
        working-directory: ares
        shell: bash
        run: |
          set -euo pipefail
          uv sync --frozen --extra dev --extra anthropic --python 3.13
          test -x tests/owner_integration/semantic_memory_revocation_owner
          HERMES_PYTHON="$PWD/.venv/bin/python" HERMES_TEST_WORKERS=1 \
            HERMES_TEST_FILE_RETRIES=0 scripts/run_tests.sh \
              tests/owner_integration/test_semantic_memory_revocation.py \
              tests/test_ares_collaboration.py \
              tests/ares_runtime/test_governed_context_materialization.py \
              tests/ares_runtime/test_memory_witness_v2.py \
              tests/ares_runtime/test_policy_basis_v2.py -- -q \
              | tee "$RUNNER_TEMP/owner-evidence/consumer-tests.log"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: current-owner-integration
          path: ${{ runner.temp }}/owner-evidence/
          retention-days: 7
          if-no-files-found: error
